packages:
  - 'packages/*'
  - 'apps/*'

minimumReleaseAgeExclude:
  - 'astro'
  - '@eventcatalog/license'
  - '@astrojs/check'
  - '@astrojs/internal-helpers'
  - '@astrojs/markdown-remark'
  - '@astrojs/markdown-satteri'
  - '@astrojs/mdx'
  - '@astrojs/node'
  - '@astrojs/react'
  - '@astrojs/telemetry'
  - '@expressive-code/core'
  - '@expressive-code/plugin-frames'
  - '@expressive-code/plugin-shiki'
  - '@expressive-code/plugin-text-markers'
  - 'astro-expressive-code'
  - 'expressive-code'
  - 'rehype-expressive-code'
  - 'satteri'
  # 4.6.6 fixes a denial of service (SNYK-JS-ZOD-20510278) and is newer than the minimum release age
  - 'zod'

peerDependencyRules:
  allowedVersions:
    'astro-expressive-code>astro': '7'
