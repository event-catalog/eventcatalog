# Make sure the EventCatalog can build OK
name: Verify Build

on:
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-packages:
    name: Build Package Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "pnpm"
      - name: Installation
        run: pnpm i
      - name: Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Build All Packages
        run: pnpm run build:bin
      - name: Package SDK
        run: pnpm pack
        working-directory: packages/sdk
      - name: Package CLI
        run: pnpm pack
        working-directory: packages/cli
      - name: Package Core
        run: pnpm pack
        working-directory: packages/core
      - name: Package Linter
        run: pnpm pack
        working-directory: packages/linter
      - name: Package Connectors
        run: pnpm pack
        working-directory: packages/connectors
      - name: Package Visualiser
        run: pnpm pack
        working-directory: packages/visualiser
      - name: Rename package artifacts
        run: |
          mv packages/sdk/*.tgz sdk-package.tgz
          mv packages/cli/*.tgz cli-package.tgz
          mv packages/core/*.tgz core-package.tgz
          mv packages/linter/*.tgz linter-package.tgz
          mv packages/connectors/*.tgz connectors-package.tgz
          mv packages/visualiser/*.tgz visualiser-package.tgz
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eventcatalog-packages-artifact
          path: |
            sdk-package.tgz
            cli-package.tgz
            core-package.tgz
            linter-package.tgz
            connectors-package.tgz
            visualiser-package.tgz

  build-and-test:
    name: Build and Test All Packages
    needs: build-packages
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # Preserve the existing required check when artifact preparation fails.
      - name: Require successful package build
        if: needs.build-packages.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "pnpm"
      - name: Installation
        run: pnpm i
      - name: Restore package build cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
      # Turbo restores the package outputs before running tests. If the cache
      # is unavailable, its build:bin prerequisites rebuild them instead.
      - name: Test All Packages
        run: pnpm run test:ci
      - name: Check Core Types
        run: pnpm run check --skip-build
        working-directory: packages/core

  build-eventcatalog:
    name: Build EventCatalog (${{ matrix.label }})
    timeout-minutes: 10
    needs: build-packages
    strategy:
      matrix:
        include:
          - label: static, Linux
            os: ubuntu-latest
            catalog: default
            output: static
          - label: static, Windows
            os: windows-latest
            catalog: default
            output: static
          - label: SSR, Linux
            os: ubuntu-latest
            catalog: ssr
            output: server
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Locate npm cache
        id: npm-cache
        shell: bash
        run: echo "directory=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache.outputs.directory }}
          key: npm-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.catalog }}-${{ hashFiles('pnpm-lock.yaml', 'packages/*/package.json') }}
          restore-keys: npm-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.catalog }}-
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: eventcatalog-packages-artifact
      - name: Install @eventcatalog packages
        working-directory: examples/${{ matrix.catalog }}/
        run: npm install ../../sdk-package.tgz ../../core-package.tgz ../../linter-package.tgz ../../connectors-package.tgz ../../visualiser-package.tgz
      - name: Build EventCatalog
        working-directory: examples/${{ matrix.catalog }}/
        run: npx eventcatalog build
      - name: Upload failed prerender output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-prerender-${{ matrix.os }}-${{ matrix.catalog }}
          path: examples/${{ matrix.catalog }}/dist/.prerender/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
      - name: Smoke test SSR artifact
        if: matrix.output == 'server'
        run: node packages/core/scripts/ci/smoke-ssr.mjs examples/${{ matrix.catalog }}
      - name: Check build size
        if: matrix.os == 'ubuntu-latest' && matrix.output == 'static'
        run: node packages/core/scripts/check-build-size.js
        env:
          SIZE_THRESHOLD: 5
